name: Feature request
description: Suggest an improvement to FreshMesh.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who is affected and a concrete workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and how success could be evaluated.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Include workarounds, references, and any data or service dependencies.
