services:
  solver:
    build:
      context: ./routing/routing-PL
    image: freshmesh-solver:routing-pl-32488ce
    container_name: freshmesh-solver
    # Loopback only: Docker-published ports bypass host firewalls such as UFW, and only the local API calls
    # the solver. The *_PORT variables are plain port numbers (e.g. FRESHMESH_SOLVER_PORT=8001).
    ports:
      - "127.0.0.1:${FRESHMESH_SOLVER_PORT:-8000}:8000"   # routing-PL FastAPI (/solve, /health)
      - "127.0.0.1:${FRESHMESH_STREAMLIT_PORT:-8501}:8501"   # routing-PL Streamlit (internal solver comparison)
    restart: unless-stopped
