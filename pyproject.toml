[project]
name = "freshmesh"
version = "0.1.0"
description = "FreshMesh: decision support for fresh-goods replenishment and delivery"
requires-python = ">=3.12"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.138.2",
    "flwr>=1.39.0",
    "httpx>=0.27",
    "lunardate>=0.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pyproj>=3.6",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]
# Real-data validation on FreshRetailNet-50K (data_frn/): `uv sync --group bench`. The API never needs it.
bench = [
    "pyarrow>=25.0.1,<26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: needs the routing-PL solver container (FRESHMESH_SOLVER_URL)"]

[tool.ruff]
line-length = 110
extend-exclude = ["routing/routing-PL", ".venv", "web", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E741", "E501", "E402"]
"scripts/**" = ["E501", "E402"]
"routing/cli.py" = ["E501"]
